<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Convite — MGS Business &amp; Tech</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23002FA7'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial,sans-serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root{
    color-scheme: light;
    --canvas:#F5F5F7;
    --card:#FFFFFF;
    --ink:#101114;
    --ink-2:#4B4F58;
    --hair:rgba(0,0,0,.045);
    --klein:#002FA7;
    --tanger:#FF6B35;
    --r:24px;
    --pad:32px;
    --shadow:0 12px 32px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.02);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; background:var(--canvas); color:var(--ink);
    font:400 16.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; padding:24px;
  }
  main{
    width:100%; max-width:560px;
    background:var(--card); border:1px solid var(--hair);
    border-radius:var(--r); box-shadow:var(--shadow);
    padding:var(--pad);
  }
  @media (max-width:620px){ main{padding:26px} }
  .mark{
    width:34px; height:34px; display:grid; place-items:center;
    background:var(--klein); color:#fff; border-radius:11px;
    font:700 17px/1 -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    margin-bottom:26px;
  }
  .ico{
    width:52px; height:52px; border-radius:15px; display:grid; place-items:center;
    margin-bottom:22px; background:rgba(0,47,167,.09); color:var(--klein);
  }
  .ico svg{width:26px;height:26px;display:block}
  body.erro .ico{background:rgba(255,107,53,.12); color:var(--tanger)}
  h1{
    margin:0; font-size:clamp(23px,4.4vw,28px); font-weight:800;
    letter-spacing:-.028em; line-height:1.18;
  }
  p{margin:14px 0 0; color:var(--ink-2); font-size:17px; line-height:1.55}
  .botao{
    display:none; margin-top:26px; width:100%;
    padding:16px 22px; border-radius:14px;
    background:var(--klein); color:#fff; text-decoration:none;
    font-size:17px; font-weight:700; letter-spacing:-.01em; text-align:center;
  }
  body.ok .botao{display:block}
  footer{
    margin-top:30px; padding-top:20px; border-top:1px solid var(--hair);
    font-size:13.5px; color:#8A8F99;
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">M</div>

  <div class="ico" aria-hidden="true">
    <svg id="glifo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-2.8-.4L3 21l1.6-4.8A8.2 8.2 0 0 1 3.6 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8.4 8.4z"></path>
    </svg>
  </div>

  <h1 id="titulo">Você recebeu um convite para conversar.</h1>
  <p id="texto">O aplicativo ainda está em teste e não está nas lojas. Se você já tem o aplicativo no celular, toque em Abrir no aplicativo.</p>

  <a class="botao" id="abrir" href="#">Abrir no aplicativo</a>

  <footer>MGS Business &amp; Tech — Goianésia, Goiás</footer>
</main>

<script>
(function(){
  // O codigo vale se tiver exatamente 16 caracteres, so de 0-9 e a-f.
  function leCodigo(s){
    if(!s) return null;
    var c = null;
    try{
      c = new URLSearchParams(s.replace(/^[?#]/, '')).get('c');
    }catch(e){
      var m = s.match(/(?:^|[?&#])c=([^&#]*)/);
      c = m ? decodeURIComponent(m[1]) : null;
    }
    return (c && /^[0-9a-f]{16}$/.test(c)) ? c : null;
  }

  var codigo = leCodigo(window.location.search) || leCodigo(window.location.hash);

  if(codigo){
    document.body.classList.add('ok');
    document.getElementById('abrir').setAttribute('href', 'vera://convite?c=' + codigo);
  }else{
    document.body.classList.add('erro');
    document.getElementById('titulo').textContent = 'Esse link de convite está incompleto.';
    document.getElementById('texto').textContent  = 'Peça um novo a quem te convidou.';
    document.getElementById('glifo').innerHTML =
      '<circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.2"></path><path d="M12 16.4h.01"></path>';
  }

  // Tira o codigo do endereco: nao fica no historico nem vai junto se a pagina for compartilhada.
  try{
    if(window.history && window.history.replaceState){
      window.history.replaceState(null, '', '/convite/');
    }
  }catch(e){}
})();
</script>
</body>
</html>
