<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Confirmação — MGS Business &amp; Tech</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23002FA7'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial,sans-serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root{
    color-scheme: light;
    --canvas:#F5F5F7;
    --card:#FFFFFF;
    --ink:#101114;
    --ink-2:#4B4F58;
    --hair:rgba(0,0,0,.045);
    --klein:#002FA7;
    --tanger:#FF6B35;
    --r:24px;
    --pad:32px;
    --shadow:0 12px 32px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.02);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; background:var(--canvas); color:var(--ink);
    font:400 16.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; padding:24px;
  }
  main{
    width:100%; max-width:560px;
    background:var(--card); border:1px solid var(--hair);
    border-radius:var(--r); box-shadow:var(--shadow);
    padding:var(--pad);
  }
  @media (max-width:620px){ main{padding:26px} }
  .mark{
    width:34px; height:34px; display:grid; place-items:center;
    background:var(--klein); color:#fff; border-radius:11px;
    font:700 17px/1 -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    margin-bottom:26px;
  }
  .ico{
    width:52px; height:52px; border-radius:15px; display:grid; place-items:center;
    margin-bottom:22px; background:rgba(0,47,167,.09); color:var(--klein);
  }
  .ico svg{width:26px;height:26px;display:block}
  body.erro .ico{background:rgba(255,107,53,.12); color:var(--tanger)}
  h1{
    margin:0; font-size:clamp(23px,4.4vw,28px); font-weight:800;
    letter-spacing:-.028em; line-height:1.18;
  }
  p{margin:14px 0 0; color:var(--ink-2); font-size:17px; line-height:1.55}
  footer{
    margin-top:30px; padding-top:20px; border-top:1px solid var(--hair);
    font-size:13.5px; color:#8A8F99;
  }
  footer a{color:#8A8F99}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">M</div>

  <div class="ico" aria-hidden="true">
    <svg id="glifo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"></path>
    </svg>
  </div>

  <h1 id="titulo">Seu e-mail está confirmado.</h1>
  <p id="texto">Pode voltar para a Vera no celular.</p>

  <footer>MGS Business &amp; Tech — Goianésia, Goiás</footer>
</main>

<script>
(function(){
  function temErro(s){
    if(!s) return false;
    try{
      var p = new URLSearchParams(s.replace(/^[?#]/, ''));
      return p.has('error') || p.has('error_code') || p.has('error_description');
    }catch(e){
      return /(^|[?&#])error(_code|_description)?=/.test(s);
    }
  }

  var erro = temErro(window.location.search) || temErro(window.location.hash);

  if(erro){
    document.body.classList.add('erro');
    document.getElementById('titulo').textContent = 'Esse link não vale mais.';
    document.getElementById('texto').textContent  = 'Na Vera, toque em Mandar outro link.';
    document.getElementById('glifo').innerHTML =
      '<circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.2"></path><path d="M12 16.4h.01"></path>';
  }

  // Tira o code (ou o erro) do endereco: nao fica no historico nem vai junto se a pagina for compartilhada.
  try{
    if(window.history && window.history.replaceState){
      window.history.replaceState(null, '', '/confirmacao');
    }
  }catch(e){}
})();
</script>
</body>
</html>
